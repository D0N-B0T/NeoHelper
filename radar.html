<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>📡 Radar</title>
    <link rel="stylesheet" href="radar.css">
    <base target="_blank">
</head>

<body>
    <header>
        <h1>📡 Radar & Lista de Interés</h1>
    </header>

    <label>Jugadores a vigilar (separados por coma)</label>
    <input id="watchlist" type="text" placeholder="DarkLord, MG, Sniper" autocomplete="off">

    <div class="cfg">
        <div>
            <label>Distancia mínima p/ alertar (tiles)</label>
            <input id="radar-dist" type="number" min="0" value="0" placeholder="0 = cualquiera">
        </div>
        <div>
            <label>Desaparecido tras (seg)</label>
            <input id="radar-ttl" type="number" min="3" value="15">
        </div>
        <div>
            <label>Mi pos X (si no se detecta)</label>
            <input id="me-x" type="number" value="226">
        </div>
        <div>
            <label>Mi pos Y</label>
            <input id="me-y" type="number" value="236">
        </div>
    </div>
    <label>Ir a pos (X / Y)</label>
    <div style="display:flex;gap:6px">
        <input id="goto-x" type="number" placeholder="X">
        <input id="goto-y" type="number" placeholder="Y">
        <button id="goto-btn"
            style="padding:0 14px;background:#238636;color:#fff;border:1px solid #2ea043;border-radius:6px;font-weight:700;cursor:pointer">IR</button>
    </div>
    <label>Mis ubicaciones <span style="color:#8b949e;text-transform:none">clic = ir · ✕ = borrar</span></label>
    <div style="display:flex;gap:6px;margin-top:4px">
        <button id="save-cur" title="Guarda tu posición actual con nombre automático">📍 Guardar actual</button>
        <button id="save-as" title="Guarda tu posición actual con un nombre personalizado">✏️ Guardar como…</button>
    </div>
    <div id="saved-list"></div>

    <div id="radar-status" class="status">Esperando datos del juego…</div>

    <div id="radar-container">
        <div class="empty">Sin datos aún. Camina un poco en el juego.</div>
    </div>


    <label>Mapa <span id="zoom-lbl" style="color:#8b949e;text-transform:none">1×</span></label>
    <div style="display:flex;gap:4px;margin:4px 0 2px">
        <button id="zoom-out" title="Alejar (−) · rueda del ratón sobre el mapa"
            style="padding:4px 10px;background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;font:700 11px ui-monospace,monospace;cursor:pointer">−</button>
        <button id="zoom-in" title="Acercar (+) · rueda del ratón sobre el mapa"
            style="padding:4px 10px;background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;font:700 11px ui-monospace,monospace;cursor:pointer">+</button>
        <button id="zoom-reset" title="Ver el mapa completo"
            style="padding:4px 10px;background:#161b22;color:#58a6ff;border:1px solid #30363d;border-radius:4px;font:700 10px ui-monospace,monospace;cursor:pointer">COMPLETO</button>
        <button id="zoom-me" title="Centrar en el jugador (también doble clic en el mapa)"
            style="padding:4px 10px;background:#161b22;color:#3fb950;border:1px solid #30363d;border-radius:4px;font:700 10px ui-monospace,monospace;cursor:pointer">🎯
            ME</button>
    </div>

    <canvas id="map" width="256" height="256"></canvas>
    <label>Spots de mobs <span id="spots-count" style="color:#8b949e;text-transform:none">0</span></label>
    <div id="spots-list" class="lst">
        <div class="empty">Sin spots en este mapa.</div>
    </div>
    <button id="walk-stop"
        style="width:100%;margin-top:8px;padding:8px;background:#da3633;color:#fff;border:1px solid #f85149;border-radius:6px;font-weight:700;cursor:pointer;text-transform:uppercase">⛔
        Detener movimiento (Esc)</button>



    <script type="module" src="radar.js"></script>
</body>

</html>
